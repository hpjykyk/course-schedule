<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10233f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>我的课表 · 国贸2621</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SHANGHAI DIANJI UNIVERSITY</p>
          <h1>我的课表</h1>
          <p id="termLabel" class="muted">正在加载课表…</p>
        </div>
        <button id="themeToggle" class="icon-button" type="button" aria-label="切换深色模式">◐</button>
      </header>

      <section id="nextPanel" class="next-panel" aria-live="polite">
        <div class="panel-kicker">NEXT UP</div>
        <div class="next-content"><span class="loading-dot"></span>正在计算下一节课…</div>
      </section>

      <section class="toolbar" aria-label="课表导航">
        <button id="prevWeek" class="ghost-button" type="button">‹ 上一周</button>
        <div class="week-heading">
          <span id="weekLabel">第 — 周</span>
          <strong id="rangeLabel">—</strong>
        </div>
        <button id="nextWeek" class="ghost-button" type="button">下一周 ›</button>
        <button id="todayButton" class="soft-button" type="button">回到今天</button>
      </section>

      <section id="calendar" class="calendar" aria-label="每周课表"></section>

      <section class="info-grid">
        <article class="info-card">
          <div class="card-heading"><span class="heading-icon">⌁</span><h2>学期时间</h2></div>
          <div id="termTimeline" class="timeline"></div>
        </article>
        <article class="info-card">
          <div class="card-heading"><span class="heading-icon">✦</span><h2>假期与调休</h2></div>
          <div id="holidayList" class="holiday-list"></div>
        </article>
      </section>

      <footer>
        <span>数据来自你的课表 PDF · 时区 Asia/Shanghai</span>
        <span id="statusText">—</span>
      </footer>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
